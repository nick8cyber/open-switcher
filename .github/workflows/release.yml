name: release
on:
  push:
    tags: ["v*"]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build exe
        shell: cmd
        run: cd win && build.cmd
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path win/OpenSwitcher.exe, win/README.md -DestinationPath OpenSwitcher-win.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: OpenSwitcher-win.zip
  macos:
    runs-on: macos-14
    strategy:
      matrix:
        arch: [arm64, x86_64]
    env:
      # секреты в step-if недоступны — пробрасываем через env
      HAS_P12: ${{ secrets.DEVELOPER_ID_P12 != '' }}
      SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Developer ID certificate
        if: ${{ secrets.DEVELOPER_ID_P12 != '' }}
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          echo "$DEVELOPER_ID_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12
      - name: Build app (${{ matrix.arch }})
        run: cd macos && ./build.sh ${{ matrix.arch }}
      - name: Codesign
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
        run: |
          ID="${SIGN_IDENTITY:-Developer ID Application}"
          if secrets_set=1; [ -n "$SIGN_IDENTITY" ]; then
            codesign --force --deep --options runtime --timestamp --sign "$ID" macos/build/OpenSwitcher.app
          else
            codesign --force --deep -s - macos/build/OpenSwitcher.app
          fi
      - name: Notarize
        if: ${{ secrets.APPLE_ID != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          cd macos
          ditto -c -k --keepParent build/OpenSwitcher.app OpenSwitcher.app.zip
          APPLE_ID="$APPLE_ID" APPLE_APP_SPECIFIC_PASSWORD="$APPLE_APP_SPECIFIC_PASSWORD" TEAM_ID="$TEAM_ID" ./notarize.sh build/OpenSwitcher.app
      - name: Zip
        run: |
          NAME=OpenSwitcher-macOS-AppleSilicon
          [ "${{ matrix.arch }}" = "x86_64" ] && NAME=OpenSwitcher-macOS-Intel
          cd macos/build && zip -qry "../../$NAME.app.zip" OpenSwitcher.app
      - uses: softprops/action-gh-release@v2
        with:
          files: OpenSwitcher-macOS-*.zip
